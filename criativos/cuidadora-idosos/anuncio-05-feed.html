<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --wine: #6B1A3A;
    --wine-deep: #4A0F27;
    --rose: #9B3060;
    --rose-soft: #C4687A;
    --blush: #F4A7BC;
    --ink: #1A1014;
    --whatsapp: #25D366;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    background: var(--wine);
    font-family: 'Manrope', sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: absolute;
    inset: -10%;
    background:
      radial-gradient(ellipse at 75% 25%, rgba(196,104,122,0.40) 0%, transparent 55%),
      radial-gradient(ellipse at 15% 85%, rgba(74,15,39,0.7) 0%, transparent 60%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }
  .card {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    padding: 90px 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 56px;
  }
  .top { display: flex; flex-direction: column; align-items: center; }
  h1 { text-align: center; }
  .lede { text-align: center; margin-left: auto; margin-right: auto; }
  .eyebrow { justify-content: center; }
  .eyebrow::after {
    content: '';
    width: 48px; height: 1px;
    background: var(--blush);
  }
  .footer { width: 100%; justify-content: center; flex-direction: column; align-items: center; gap: 28px; }
  .sig { text-align: center; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    color: var(--blush);
    font-size: 14px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .eyebrow::before {
    content: '';
    width: 48px; height: 1px;
    background: var(--blush);
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 88px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    color: #fff;
    margin-top: 36px;
    max-width: 880px;
  }
  h1 em {
    font-style: italic;
    font-weight: 400;
    color: var(--blush);
    position: relative;
  }
  h1 em::after {
    content: '';
    position: absolute;
    bottom: 0.08em; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--blush), transparent);
    opacity: 0.5;
  }
  .lede {
    font-size: 26px;
    line-height: 1.55;
    color: rgba(255,255,255,0.82);
    max-width: 780px;
    font-weight: 300;
    margin-top: 40px;
  }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: var(--whatsapp);
    color: #fff;
    font-weight: 600;
    font-size: 22px;
    padding: 22px 38px;
    border-radius: 999px;
    box-shadow: 0 12px 40px rgba(37,211,102,0.35);
  }
  .cta svg { width: 26px; height: 26px; fill: #fff; }
  .sig {
    text-align: right;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: rgba(255,255,255,0.8);
    font-size: 22px;
  }
  .sig span {
    display: block;
    font-family: 'Manrope', sans-serif;
    font-style: normal;
    font-size: 12px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-top: 6px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="eyebrow">Cuidado domiciliar &middot; BH</div>
      <h1>Você sai pra trabalhar e fica com o <em>coração apertado</em></h1>
      <p class="lede">Não precisa ser assim. Existe um jeito da sua mãe ficar medicada na hora certa, alimentada e em companhia, enquanto você trabalha tranquilo.</p>
    </div>
    <div class="footer">
      <div class="cta">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        Conversa no WhatsApp
      </div>
      <div class="sig">Mariana Caroline<span>Téc. enfermagem</span></div>
    </div>
  </div>
</body>
</html>
