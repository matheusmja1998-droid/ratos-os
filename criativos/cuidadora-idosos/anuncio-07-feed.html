<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --wine:#6B1A3A; --rose:#9B3060; --blush:#F4A7BC; --whatsapp:#25D366; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; background:var(--wine); font-family:'Manrope',sans-serif; color:#fff; overflow:hidden; position:relative; }
  body::before { content:''; position:absolute; inset:-10%;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(196,104,122,0.40) 0%, transparent 55%),
      radial-gradient(ellipse at 20% 90%, rgba(74,15,39,0.7) 0%, transparent 60%);
    pointer-events:none; }
  body::after { content:''; position:absolute; inset:0; pointer-events:none; opacity:0.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode:overlay; }
  .card { position:relative; z-index:2; width:100%; height:100%; padding:90px 100px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:48px; }
  .quote-mark { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:160px; line-height:0.6; color:var(--blush); opacity:0.35; }
  h1 { font-family:'Cormorant Garamond',serif; font-weight:500; font-size:90px; line-height:1.02; letter-spacing:-0.02em; color:#fff; max-width:880px; }
  h1 em { font-style:italic; font-weight:400; color:var(--blush); }
  .lede { font-size:24px; line-height:1.6; color:rgba(255,255,255,0.82); max-width:740px; font-weight:300; }
  .cta { display:inline-flex; align-items:center; gap:14px; background:var(--whatsapp); color:#fff; font-weight:600; font-size:22px; padding:22px 38px; border-radius:999px; box-shadow:0 12px 40px rgba(37,211,102,0.35); }
  .cta svg { width:26px; height:26px; fill:#fff; }
</style>
</head>
<body>
  <div class="card">
    <div class="quote-mark">"</div>
    <h1>Antes de qualquer coisa, <em>a gente conversa</em>.</h1>
    <p class="lede">Sem compromisso, sem cobrança. Um papo no WhatsApp pra você entender quem vai cuidar do seu familiar antes de qualquer decisão.</p>
