<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1584px; height:396px;
  background:#080808;
  font-family:'Plus Jakarta Sans',sans-serif;
  position:relative; overflow:hidden;
}
.glow {
  position:absolute;
  width:600px; height:600px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(0,232,120,0.13) 0%, transparent 65%);
  top:50%; left:-100px;
  transform:translateY(-50%);
  pointer-events:none;
}
.glow2 {
  position:absolute;
  width:400px; height:400px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(0,232,120,0.07) 0%, transparent 65%);
  top:50%; right:200px;
  transform:translateY(-50%);
  pointer-events:none;
}
.grid-lines {
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(0,232,120,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,232,120,0.04) 1px, transparent 1px);
  background-size:60px 60px;
}
.content {
  position:relative; z-index:5;
  height:100%;
  display:flex;
  align-items:center;
  padding:0 100px;
  gap:64px;
}
.left {
  display:flex;
  flex-direction:column;
  gap:14px;
}
.tag {
  font-size:12px; font-weight:700;
  letter-spacing:4px; text-transform:uppercase;
  color:#00E878;
  opacity:0.8;
}
.headline {
  font-size:38px; font-weight:800;
  color:#fff;
  line-height:1.2;
  max-width:700px;
}
.headline span { color:#00E878; }
.divider {
  width:1px; height:120px;
  background:linear-gradient(to bottom, transparent, #00E87840, transparent);
  flex-shrink:0;
}
.right {
  display:flex;
  flex-direction:column;
  gap:10px;
}
.handle {
  font-size:28px; font-weight:800;
  color:#00E878;
  letter-spacing:-0.5px;
}
.sub {
  font-size:16px; font-weight:400;
  color:#ffffff50;
  line-height:1.5;
}
.accent-dot {
  width:6px; height:6px;
  border-radius:50%;
  background:#00E878;
  margin-bottom:4px;
}
</style>
</head>
<body>
<div class="grid-lines"></div>
<div class="glow"></div>
<div class="glow2"></div>
<div class="content">
  <div class="left">
    <div class="tag">Estruturação comercial B2B</div>
    <div class="headline">Ajudo integradoras solares a parar de <span>depender de indicação.</span></div>
  </div>
  <div class="divider"></div>
  <div class="right">
    <div class="accent-dot"></div>
    <div class="handle">@eumatheusj</div>
    <div class="sub">Fundador L.M Agência<br>BH — Atendo todo o Brasil</div>
  </div>
</div>
</body>
</html>
