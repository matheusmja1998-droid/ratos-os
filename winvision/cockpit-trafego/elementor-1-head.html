
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

<style>
/* ───────────────────────────────────────────────
   TOKENS
─────────────────────────────────────────────── */
:root {
  --bg: #0A0A0F;
  --bg-deep: #08080C;
  --bg-card: #12121A;
  --bg-card-alt: rgba(18, 18, 26, 0.6);
  --cyan: #00D9FF;
  --cyan-soft: rgba(0, 217, 255, 0.2);
  --cyan-glow: rgba(0, 217, 255, 0.5);
  --purple: #B026FF;
  --purple-deep: #6B2FFF;
  --purple-soft: rgba(176, 38, 255, 0.25);
  --white: #FFFFFF;
  --gray: #A8A8B8;
  --gray-dim: #6B6B7A;
  --grad-line: linear-gradient(90deg, #00D9FF 0%, #B026FF 100%);
  --grad-text: linear-gradient(90deg, #00D9FF 0%, #B026FF 100%);
  --grad-halo: radial-gradient(circle, rgba(176, 38, 255, 0.25) 0%, transparent 70%);
  --glow-neon: 0 0 40px rgba(0, 217, 255, 0.5), 0 0 80px rgba(176, 38, 255, 0.3);
  --glow-soft: 0 0 20px rgba(0, 217, 255, 0.25);
  --font-display: 'Bricolage Grotesque', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --container: 1200px;
  --section-py: 110px;
}

/* ───────────────────────────────────────────────
   RESET
─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  font-weight: 400;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* Grain overlay sutil pro fundo todo */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ───────────────────────────────────────────────
   UTILITIES
─────────────────────────────────────────────── */
.container {
  max-width: var(--container);
  margin: 0 auto;
  padding: 0 32px;
  position: relative;
  z-index: 2;
}

.section {
  padding: var(--section-py) 0;
  position: relative;
  overflow: hidden;
}

.section--dark { background: var(--bg-deep); }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--cyan);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  margin-bottom: 28px;
}
.tag::before {
  content: '';
  width: 24px;
  height: 1px;
  background: var(--grad-line);
}

h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.05;
  color: var(--white);
}

h1 { font-size: clamp(2.4rem, 5.4vw, 4.6rem); }
h2 { font-size: clamp(2rem, 4.2vw, 3.6rem); }
h3 { font-size: clamp(1.4rem, 2.2vw, 1.8rem); }

p { color: var(--gray); }
.text-white { color: var(--white); }
.text-gray { color: var(--gray); }

.gradient-text {
  background: var(--grad-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.divider-line {
  height: 1px;
  background: var(--grad-line);
  opacity: 0.4;
  border: none;
}

/* Cards */
.glass {
  background: var(--bg-card-alt);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--cyan-soft);
  border-radius: 18px;
  position: relative;
}
.glass--bordered {
  background: var(--bg-card-alt);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 20px;
  position: relative;
  padding: 32px;
}
.glass--bordered::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 20px;
  padding: 1.5px;
  background: var(--grad-line);
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 18px 36px;
  border-radius: 999px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 0.01em;
  transition: transform 0.2s ease, box-shadow 0.3s ease, filter 0.2s ease;
  cursor: pointer;
  white-space: nowrap;
}
.btn--primary {
  background: var(--cyan);
  color: var(--bg);
  box-shadow:
    0 0 30px rgba(0, 217, 255, 0.45),
    0 0 60px rgba(176, 38, 255, 0.2),
    inset 0 0 0 1px rgba(255, 255, 255, 0.15);
}
.btn--primary:hover {
  transform: translateY(-2px);
  box-shadow:
    0 0 45px rgba(0, 217, 255, 0.7),
    0 0 90px rgba(176, 38, 255, 0.35),
    inset 0 0 0 1px rgba(255, 255, 255, 0.25);
  filter: brightness(1.05);
}
.btn--lg { padding: 22px 48px; font-size: 17px; }
.btn--full { width: 100%; }

.link-cyan {
  color: var(--cyan);
  font-weight: 500;
  font-size: 15px;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}
.link-cyan:hover { border-bottom-color: var(--cyan); }

/* Halos */
.halo {
  position: absolute;
  pointer-events: none;
  z-index: 0;
  filter: blur(20px);
}
.halo--purple {
  background: var(--grad-halo);
}
.halo--cyan {
  background: radial-gradient(circle, rgba(0, 217, 255, 0.18) 0%, transparent 70%);
}

/* ───────────────────────────────────────────────
   NAV (minimal, top)
─────────────────────────────────────────────── */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  background: rgba(10, 10, 15, 0.65);
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
}
.nav__inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 64px;
}
.nav__logo {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  color: var(--white);
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav__logo-mark {
  width: 26px; height: 26px; border-radius: 8px;
  background: var(--grad-line);
  display: grid; place-items: center;
  box-shadow: var(--glow-soft);
}
.nav__logo-mark svg { width: 14px; height: 14px; color: var(--bg); }
.nav__cta {
  display: flex; align-items: center; gap: 18px;
}
.nav__price {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--gray);
}
.nav__link-mobile {
  display: none;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--cyan);
  letter-spacing: 0.05em;
  padding: 8px 16px;
  border: 1px solid rgba(0, 217, 255, 0.4);
  border-radius: 999px;
  transition: all 0.2s;
}
.nav__link-mobile:hover {
  background: rgba(0, 217, 255, 0.08);
}
@media (max-width: 768px) {
  .nav__price { display: none; }
  .nav__btn { display: none; }
  .nav__link-mobile { display: inline-flex; }
  .nav__logo { font-size: 13px; gap: 8px; }
  .nav__logo-mark { width: 22px; height: 22px; }
  .nav__logo-mark svg { width: 12px; height: 12px; }
}

/* ───────────────────────────────────────────────
   1. HERO
─────────────────────────────────────────────── */
.hero {
  padding: 64px 0 110px;
  position: relative;
  overflow: hidden;
}
.hero .halo--purple {
  width: 700px; height: 700px;
  top: -200px; left: -200px;
  opacity: 0.6;
}
.hero .halo--cyan {
  width: 600px; height: 600px;
  bottom: -100px; right: -150px;
  opacity: 0.5;
}
.hero__grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 80px;
  align-items: center;
}
.hero__title {
  margin: 0 0 24px;
  font-size: clamp(2.3rem, 4.6vw, 4rem);
}
.hero__title .last {
  display: inline-block;
}
.hero__sub {
  font-size: 18px;
  color: var(--gray);
  max-width: 560px;
  margin-bottom: 36px;
  line-height: 1.55;
}
.hero__actions {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-bottom: 40px;
  flex-wrap: wrap;
}
.hero__trust {
  display: flex;
  gap: 28px;
  flex-wrap: wrap;
}
.trust-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--gray);
}
.trust-item svg {
  width: 18px; height: 18px;
  color: var(--cyan);
  filter: drop-shadow(0 0 6px var(--cyan-glow));
  flex-shrink: 0;
}

/* Terminal mockup */
.terminal {
  background: var(--bg-card);
  border-radius: 14px;
  border: 1px solid rgba(0, 217, 255, 0.15);
  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.6),
    0 0 60px rgba(176, 38, 255, 0.15),
    0 0 100px rgba(0, 217, 255, 0.08);
  overflow: hidden;
  position: relative;
  z-index: 2;
}
.terminal__bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 18px;
  background: rgba(0, 0, 0, 0.4);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}
.terminal__dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  display: inline-block;
}
.terminal__dot--red    { background: #FF5F57; }
.terminal__dot--yellow { background: #FEBC2E; }
.terminal__dot--green  { background: #28C840; }
.terminal__title {
  margin-left: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--gray-dim);
}
.terminal__body {
  padding: 24px 22px;
  font-family: var(--font-mono);
  font-size: 13.5px;
  line-height: 1.85;
  color: #E8E8F0;
  white-space: pre-wrap;
}
.terminal__prompt { color: var(--cyan); }
.terminal__cmd    { color: var(--white); }
.terminal__ok {
  color: var(--cyan);
  text-shadow: 0 0 8px var(--cyan-glow);
}
.terminal__result {
  color: var(--white);
  margin-top: 10px;
  display: block;
}

/* ───────────────────────────────────────────────
   2. TRAVANDO
─────────────────────────────────────────────── */
.travando__title {
  font-size: clamp(2.6rem, 5.5vw, 4.4rem);
  text-shadow: 0 0 50px rgba(0, 217, 255, 0.18);
  margin-bottom: 40px;
}
.travando__body {
  max-width: 720px;
  font-size: 19px;
  line-height: 1.65;
  color: var(--white);
}
.travando__body p { color: var(--white); margin-bottom: 22px; }
.travando__highlight {
  margin-top: 56px;
  max-width: 720px;
  padding: 28px 36px;
  font-family: var(--font-display);
  font-size: clamp(1.4rem, 2.6vw, 1.95rem);
  font-weight: 700;
  color: var(--white);
  text-align: left;
}

/* ───────────────────────────────────────────────
   3. DEMONSTRAÇÃO
─────────────────────────────────────────────── */
.demo__intro { max-width: 720px; margin-bottom: 64px; }
.demo__intro h2 { margin-bottom: 18px; }
.demo__intro p { font-size: 17px; }

.demo__grid {
  display: grid;
  gap: 32px;
}
.demo__caption {
  margin-top: 16px;
  font-size: 14px;
  color: var(--gray);
  max-width: 600px;
}

/* Dashboard mockup */
.dash {
  background: var(--bg-card);
  border-radius: 14px;
  border: 1px solid rgba(0, 217, 255, 0.15);
  overflow: hidden;
  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.6),
    0 0 60px rgba(0, 217, 255, 0.08);
}
.dash__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 22px;
  background: rgba(0, 0, 0, 0.4);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}
.dash__title {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--cyan);
  letter-spacing: 0.05em;
}
.dash__time {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--gray-dim);
}
.dash__body {
  padding: 28px 22px;
  font-family: var(--font-mono);
  font-size: 14px;
}
.dash__row {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 0.8fr 1.4fr;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  align-items: center;
}
.dash__row:last-child { border-bottom: 0; }
.dash__row--head {
  font-size: 11px;
  color: var(--gray-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding-bottom: 18px;
}
.dash__client { color: var(--white); font-weight: 500; }
.dash__metric { color: var(--gray); }
.dash__delta--up   { color: #00D9FF; }
.dash__delta--down { color: #B026FF; }
.dash__status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.dash__status--ok::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: #00D9FF; box-shadow: 0 0 8px var(--cyan-glow);
}
.dash__status--alert {
  color: #B026FF;
  font-size: 12px;
}
.dash__status--alert::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: #B026FF; box-shadow: 0 0 8px rgba(176, 38, 255, 0.6);
}

/* ───────────────────────────────────────────────
   4. SKILLS
─────────────────────────────────────────────── */
.skills__intro { max-width: 760px; margin-bottom: 72px; }
.skills__intro h2 { margin-bottom: 18px; }

.skill {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 48px;
  align-items: flex-start;
  padding: 44px 44px;
  margin-bottom: 24px;
  background: var(--bg-card-alt);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--cyan-soft);
  border-radius: 20px;
  transition: border-color 0.3s, transform 0.3s;
  position: relative;
  overflow: hidden;
}
.skill:hover {
  border-color: rgba(0, 217, 255, 0.35);
  transform: translateY(-2px);
}
.skill::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 240px; height: 240px;
  background: radial-gradient(circle, rgba(176, 38, 255, 0.12) 0%, transparent 70%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s;
}
.skill:hover::after { opacity: 1; }

.skill__number {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(5rem, 8vw, 7.5rem);
  line-height: 0.85;
  background: var(--grad-line);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.04em;
}
.skill__name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--white);
  margin-bottom: 16px;
}
.skill__desc {
  font-size: 16px;
  color: var(--gray);
  margin-bottom: 24px;
  max-width: 640px;
}
.skill__cmd-label {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--cyan);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  display: block;
}
.skill__cmd {
  background: var(--bg-deep);
  border: 1px solid rgba(0, 217, 255, 0.22);
  border-radius: 10px;
  padding: 16px 20px;
  font-family: var(--font-mono);
  font-style: italic;
  font-size: 14px;
  color: var(--white);
  margin-bottom: 18px;
}
.skill__time {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(0, 217, 255, 0.08);
  border: 1px solid rgba(0, 217, 255, 0.3);
  color: var(--cyan);
  font-family: var(--font-mono);
  font-size: 13px;
  box-shadow: 0 0 16px rgba(0, 217, 255, 0.15);
}
.skill__time svg {
  width: 14px; height: 14px;
}

.skills__footer {
  margin-top: 48px;
  padding: 36px;
  text-align: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.1rem, 2vw, 1.5rem);
  color: var(--white);
}

/* ───────────────────────────────────────────────
   5. AULAS
─────────────────────────────────────────────── */
.aulas__intro { max-width: 720px; margin-bottom: 64px; }
.aulas__intro h2 { margin-bottom: 18px; }

.aula {
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 28px;
  align-items: center;
  padding: 26px 28px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  transition: background 0.3s;
}
.aula:hover { background: rgba(0, 217, 255, 0.03); }

.aula__num {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 38px;
  color: var(--cyan);
  letter-spacing: -0.04em;
  line-height: 1;
}
.aula__content { }
.aula__title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  color: var(--white);
  margin-bottom: 6px;
}
.aula__desc {
  font-size: 15px;
  color: var(--gray);
}
.aula__time {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--cyan);
  padding: 7px 15px;
  border-radius: 999px;
  border: 1px solid rgba(0, 217, 255, 0.3);
  background: rgba(0, 217, 255, 0.06);
}

.aulas__total {
  margin-top: 40px;
  text-align: center;
  padding: 30px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.1rem, 2vw, 1.5rem);
  color: var(--white);
}
.aulas__total strong {
  background: var(--grad-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ───────────────────────────────────────────────
   6. CONTAS DE PADEIRO
─────────────────────────────────────────────── */
.padeiro {
  position: relative;
}
.padeiro .halo--purple {
  width: 700px; height: 700px;
  top: 20%; right: -200px;
  opacity: 0.5;
}
.padeiro__intro { max-width: 720px; margin-bottom: 48px; }
.padeiro__intro h2 { margin-bottom: 28px; }
.padeiro__body { max-width: 720px; }
.padeiro__body p { color: var(--white); font-size: 18px; margin-bottom: 18px; }

.padeiro__math {
  margin: 56px 0;
  padding: 56px 48px;
  text-align: center;
}
.padeiro__math-line {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.6rem, 3.5vw, 2.6rem);
  line-height: 1.2;
  margin-bottom: 24px;
  color: var(--white);
}
.padeiro__math-line strong {
  background: var(--grad-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 25px rgba(176, 38, 255, 0.4));
}
.padeiro__math-big {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(3rem, 7vw, 5.5rem);
  line-height: 1;
  letter-spacing: -0.03em;
  background: var(--grad-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 40px rgba(0, 217, 255, 0.35));
}
.padeiro__close {
  font-size: 18px;
  color: var(--white);
  margin-bottom: 28px;
}
.padeiro__final {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.3rem, 2.4vw, 1.8rem);
  color: var(--cyan);
  text-shadow: 0 0 20px rgba(0, 217, 255, 0.4);
}

/* ───────────────────────────────────────────────
   7. DEPOIMENTOS
─────────────────────────────────────────────── */
