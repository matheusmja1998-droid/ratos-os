<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 300px; height: 250px; overflow: hidden; }
  body {
    background: #0A0A0F;
    font-family: 'Fraunces', serif;
    color: #fff;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: absolute;
    top: -50px;
    right: -50px;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, rgba(0, 217, 255, 0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: absolute;
    bottom: -60px;
    left: -60px;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, rgba(176, 38, 255, 0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .top { position: relative; z-index: 2; }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: #00D9FF;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .title {
    font-size: 26px;
    font-weight: 500;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: #fff;
  }
  .title em { font-style: italic; color: #00D9FF; font-weight: 500; }
  .bottom {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #A8A8B8;
    line-height: 1.4;
    max-width: 170px;
  }
  .price-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    color: #A8A8B8;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 2px;
    text-align: right;
  }
  .price {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 38px;
    color: #00D9FF;
    line-height: 1;
    letter-spacing: -0.02em;
    text-align: right;
  }
</style>
</head>
<body>
  <div class="top">
    <div class="tag">COCKPIT TRÁFEGO</div>
    <h1 class="title">Opere Meta, Google e GA4 <em>conversando.</em></h1>
  </div>
  <div class="bottom">
    <div class="sub">5 skills · Claude Code · pagamento único</div>
    <div>
      <div class="price-label">apenas</div>
      <div class="price">R$67</div>
    </div>
  </div>
</body>
</html>
